<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Digital Shadow Puppet</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="stage">
        <!-- Left Puppet -->
        <div id="puppet-left" class="puppet-wrapper">
            <img src="https://placehold.co/300x450/333333/FFFFFF?text=Wayang+1+Idle" class="pose pose-idle" alt="Idle">
            <img src="https://placehold.co/300x450/cc0000/FFFFFF?text=Wayang+1+Action" class="pose pose-action" alt="Action">
        </div>

        <!-- Right Puppet -->
        <div id="puppet-right" class="puppet-wrapper">
            <img src="https://placehold.co/300x450/333333/FFFFFF?text=Wayang+2+Idle" class="pose pose-idle" alt="Idle">
            <img src="https://placehold.co/300x450/cc0000/FFFFFF?text=Wayang+2+Action" class="pose pose-action" alt="Action">
        </div>
    </div>

    <video id="webcam" autoplay playsinline></video>
    <div id="status">Menunggu kamera...</div>

    <!-- MediaPipe Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    
    <!-- Our Custom Script -->
    <script src="script.js"></script>
</body>
</html>
